name: Lint, Typecheck & Test

on:
  push:
    branches: [staging, trunk]
  pull_request:
    branches: [staging, trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & Format Check ──────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run linter
        run: pnpm run lint

  # ── Job 2: Type Check ─────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Type check all workspaces
        run: pnpm run typecheck

  # ── Job 3: Tests ──────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nube-auth
          POSTGRES_PASSWORD: nube-auth-test
          POSTGRES_DB: nube-auth-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nube-auth:nube-auth-test@localhost:5432/nube-auth-test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: test-session-secret-32-bytes-long!!
      S2S_SECRET: test-s2s-secret-32-bytes-long!!!
      ENCRYPTION_KEY: test-encryption-key-32-bytes-long!!
      JWT_SECRET: test-jwt-secret-32-bytes-long!!!!
      PAYMENT_CONFIGS_KEY: test-payment-configs-key-32-bytes!
      EMAIL_API_KEY: test-email-api-key
      EMAIL_FROM: test@nubeauth.com
      GATEWAY_PUBLIC_URL: http://localhost:3004
      CORE_INTERNAL_URL: http://localhost:3003
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm run db:push

      - name: Run tests
        run: pnpm run test
