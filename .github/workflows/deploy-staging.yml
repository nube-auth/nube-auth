name: Deploy Staging

# ═══════════════════════════════════════════════════════════════════════════════
# Staging Deploy Workflow
#
# One-click trigger: Zero inputs required.
# Builds and deploys the all-in-one staging image:
#   ghcr.io/nube-auth/nube-auth-staging-all:latest
#
# Runs core (3003), gateway (3004), workers (3005), and nginx (8080) in a single
# container managed by supervisord on Railway staging.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  meta:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.params.outputs.domain }}
      staging_build_args: ${{ steps.params.outputs.staging_build_args }}
    steps:
      - name: Checkout host map
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - id: params
        run: |
          DOMAIN="${{ vars.NUBE_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then DOMAIN="nubeauth.com"; fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          {
            echo "staging_build_args<<EOF"
            NUBE_DOMAIN="$DOMAIN" NUBE_ENV=staging node scripts/print-nube-hosts.mjs
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Staging (all-in-one)
    needs: meta
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-staging-all
      dockerfile: nube-scripts/deploy/docker/Dockerfile.app
      branch: staging
      image_tag: latest
      platforms: linux/amd64
      build_args: ${{ needs.meta.outputs.staging_build_args }}
    secrets: inherit

  # ═════════════════════════════════════════════════════════════════════════
  # Deploy to Railway (runs only after the build step is done)
  # ═════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Railway
    needs: [meta, build]
    if: |
      always() &&
      needs.meta.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Deploy to Railway
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID_STAGING: ${{ vars.RAILWAY_SERVICE_ID_STAGING }}
        run: |
          set -euo pipefail
          echo "Deploying to staging..."

          npx tsx nube-scripts/dev/scripts/railway-deploy.ts \
            --env staging \
            --environment-id "${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}" \
            --service-id "${{ vars.RAILWAY_SERVICE_ID_STAGING }}" \
            --service all \
            --tag latest \
            --wait || {
              echo "::warning title=Railway Deploy Failed::Railway staging deployment failed. Image was built and pushed to GHCR successfully."
              exit 1
            }
