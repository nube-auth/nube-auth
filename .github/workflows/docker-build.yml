name: Build & Publish

# ═══════════════════════════════════════════════════════════════════════════════
# Staging (manual dispatch, branch = staging):
#   Builds a single all-in-one image: nube-auth-staging:staging
#   (core + gateway + workers + dashboards in one container via supervisord).
#   Keeps Railway service count minimal for cost efficiency.
#
# Trunk (manual dispatch, branch = trunk, or push of v* tag):
#   Builds 4 separate images in parallel:
#     nube-auth-core:trunk          (Dockerfile.core)
#     nube-auth-gateway:trunk       (Dockerfile.gateway)
#     nube-auth-workers:trunk       (Dockerfile.workers)
#     nube-auth-dashboards:trunk    (Dockerfile.dashboards — all 4 in one nginx)
#   PLUS one combined image:
#     nube-auth-prod:trunk          (Dockerfile.app — all-in-one via supervisord)
#   Tag pushes also tag images with the version (e.g. v1.2.3).
#
# Railway auto-deploy:
#   Set these GitHub Variables to trigger a Railway deploy after push:
#     RAILWAY_TOKEN                             — Railway API token (Secret)
#     RAILWAY_STAGING_ENVIRONMENT_ID            — Staging env UUID
#     RAILWAY_PRODUCTION_ENVIRONMENT_ID          — Production env UUID
#     RAILWAY_SERVICE_ID_STAGING                     — Service ID for staging app
#     RAILWAY_SERVICE_ID_PRODUCTION_CORE / _GATEWAY / _WORKERS / _DASHBOARDS — Production
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - trunk
  push:
    tags:
      - 'v*'

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true
  # Limit to 1 build per branch to avoid runner resource exhaustion

# Required so reusable workflows can push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  # ── Resolve branch & version tag ────────────────────────────────────────────
  meta:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.params.outputs.branch }}
      extra_tag: ${{ steps.params.outputs.extra_tag }}
      domain: ${{ steps.params.outputs.domain }}
      staging_build_args: ${{ steps.params.outputs.staging_build_args }}
      production_build_args: ${{ steps.params.outputs.production_build_args }}
    steps:
      - name: Checkout host map
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "branch=trunk" >> "$GITHUB_OUTPUT"
            echo "extra_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "extra_tag=" >> "$GITHUB_OUTPUT"
          fi
          DOMAIN="${{ vars.NUBE_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then DOMAIN="nubeauth.com"; fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          {
            echo "staging_build_args<<EOF"
            NUBE_DOMAIN="$DOMAIN" NUBE_ENV=staging node scripts/print-nube-hosts.mjs
            echo "EOF"
            echo "production_build_args<<EOF"
            NUBE_DOMAIN="$DOMAIN" NUBE_ENV=production node scripts/print-nube-hosts.mjs
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════════════════════════════
  # STAGING — single combined image (Dockerfile.app)
  # ═════════════════════════════════════════════════════════════════════════
  staging-app:
    name: Staging (all-in-one)
    needs: meta
    if: needs.meta.outputs.branch == 'staging'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-staging
      dockerfile: nube-scripts/deploy/docker/Dockerfile.app
      branch: staging
      platforms: linux/amd64
      build_args: ${{ needs.meta.outputs.staging_build_args }}
      railway_service_var_suffix: STAGING
      railway_environment_id: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
    secrets: inherit

  # ═════════════════════════════════════════════════════════════════════════
  # TRUNK / PRODUCTION — 4 separate images (build 2 at a time for speed + reliability)
  # Batch 1: Core + Gateway (parallel)
  # Batch 2: Workers + Dashboards (parallel, after batch 1)
  # Batch 3: Production all-in-one (after batch 2)
  # ═════════════════════════════════════════════════════════════════════════
  core:
    name: Core
    needs: meta
    if: needs.meta.outputs.branch == 'trunk'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-core
      dockerfile: nube-scripts/deploy/docker/Dockerfile.core
      branch: trunk
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      railway_service_var_suffix: CORE
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  gateway:
    name: Gateway
    needs: meta
    if: needs.meta.outputs.branch == 'trunk'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-gateway
      dockerfile: nube-scripts/deploy/docker/Dockerfile.gateway
      branch: trunk
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      railway_service_var_suffix: GATEWAY
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  workers:
    name: Workers
    needs: [meta, core, gateway]
    if: needs.meta.outputs.branch == 'trunk'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-workers
      dockerfile: nube-scripts/deploy/docker/Dockerfile.workers
      branch: trunk
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      railway_service_var_suffix: WORKERS
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  dashboards:
    name: Dashboards (combined)
    needs: [meta, core, gateway]
    if: needs.meta.outputs.branch == 'trunk'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-dashboards
      dockerfile: nube-scripts/deploy/docker/Dockerfile.dashboards
      branch: trunk
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      build_args: ${{ needs.meta.outputs.production_build_args }}
      railway_service_var_suffix: DASHBOARDS
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  # ── Combined production image (all-in-one via supervisord) ──────────────────
  prod-all-in-one:
    name: Production (all-in-one)
    needs: [meta, workers, dashboards]
    if: needs.meta.outputs.branch == 'trunk'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-prod
      dockerfile: nube-scripts/deploy/docker/Dockerfile.app
      branch: trunk
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      build_args: ${{ needs.meta.outputs.production_build_args }}
    secrets: inherit
