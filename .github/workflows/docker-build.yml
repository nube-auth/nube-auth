name: Build & Publish

# ═══════════════════════════════════════════════════════════════════════════════
# Image name is the service. Tag is the environment, never the git branch.
#   ghcr.io/nube-auth/nube-auth-<service>:<env>
#   ghcr.io/nube-auth/nube-auth-<service>:<env>-<sha>
#   ghcr.io/nube-auth/nube-auth-<service>:<version>   (v* tag push only)
#
# Staging (manual dispatch, branch = staging):
#   nube-auth-app:staging
#   (core + gateway + workers + dashboards in one container via supervisord).
#
# Production (manual dispatch, branch = trunk, or push of a v* tag):
#   nube-auth-core:production
#   nube-auth-gateway:production
#   nube-auth-workers:production
#   nube-auth-dashboards:production
#   nube-auth-app:production          (Dockerfile.app — published, not deployed)
# A v* push checks out trunk and also tags images with the version (v1.2.3).
#
# Railway:
#   A normal run builds, pushes, then deploys. action=deploy skips the build
#   and rolls an image already in GHCR (env change, failed deploy, rollback).
#     RAILWAY_TOKEN                             — Railway API token (Secret)
#     RAILWAY_PROJECT_ID                        — Railway project UUID
#     RAILWAY_STAGING_ENVIRONMENT_ID            — Staging env UUID
#     RAILWAY_PRODUCTION_ENVIRONMENT_ID          — Production env UUID
#     RAILWAY_SERVICE_ID_STAGING                     — Service ID for staging app
#     RAILWAY_SERVICE_ID_PRODUCTION_CORE / _GATEWAY / _WORKERS / _DASHBOARDS
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build, or environment to redeploy'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - trunk
      action:
        description: 'Build and deploy, or redeploy an existing image'
        required: true
        type: choice
        default: build
        options:
          - build
          - deploy
      service:
        description: 'Production service (deploy only; blank = all)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - app
          - core
          - gateway
          - workers
          - dashboards
      tag:
        description: 'Image tag (deploy only; blank = staging or production)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: docker-build-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.action || 'build' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'deploy' }}

# Required so reusable workflows can push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  # ── Resolve branch & version tag ────────────────────────────────────────────
  meta:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.params.outputs.branch }}
      action: ${{ steps.params.outputs.action }}
      extra_tag: ${{ steps.params.outputs.extra_tag }}
      domain: ${{ steps.params.outputs.domain }}
      staging_build_args: ${{ steps.params.outputs.staging_build_args }}
      production_build_args: ${{ steps.params.outputs.production_build_args }}
    steps:
      - name: Checkout host map
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "branch=trunk" >> "$GITHUB_OUTPUT"
            echo "action=build" >> "$GITHUB_OUTPUT"
            echo "extra_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "extra_tag=" >> "$GITHUB_OUTPUT"
          fi
          DOMAIN="${{ vars.NUBE_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then DOMAIN="nubeauth.com"; fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          {
            echo "staging_build_args<<EOF"
            NUBE_DOMAIN="$DOMAIN" NUBE_ENV=staging node scripts/print-nube-hosts.mjs
            echo "EOF"
            echo "production_build_args<<EOF"
            NUBE_DOMAIN="$DOMAIN" NUBE_ENV=production node scripts/print-nube-hosts.mjs
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════════════════════════════
  # STAGING — single combined image (Dockerfile.app)
  # ═════════════════════════════════════════════════════════════════════════
  staging-app:
    name: Staging (all-in-one)
    needs: meta
    if: needs.meta.outputs.branch == 'staging' && needs.meta.outputs.action == 'build'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-app
      dockerfile: nube-scripts/deploy/docker/Dockerfile.app
      branch: staging
      image_tag: staging
      platforms: linux/amd64
      build_args: ${{ needs.meta.outputs.staging_build_args }}
      railway_service_var_suffix: STAGING
      railway_environment_id: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
    secrets: inherit

  # ═════════════════════════════════════════════════════════════════════════
  # TRUNK / PRODUCTION — 4 separate images (build 2 at a time for speed + reliability)
  # Batch 1: Core + Gateway (parallel)
  # Batch 2: Workers + Dashboards (parallel, after batch 1)
  # Batch 3: Production all-in-one (after batch 2)
  # ═════════════════════════════════════════════════════════════════════════
  core:
    name: Core
    needs: meta
    if: needs.meta.outputs.branch == 'trunk' && needs.meta.outputs.action == 'build'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-core
      dockerfile: nube-scripts/deploy/docker/Dockerfile.core
      branch: trunk
      image_tag: production
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      railway_service_var_suffix: CORE
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  gateway:
    name: Gateway
    needs: meta
    if: needs.meta.outputs.branch == 'trunk' && needs.meta.outputs.action == 'build'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-gateway
      dockerfile: nube-scripts/deploy/docker/Dockerfile.gateway
      branch: trunk
      image_tag: production
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      railway_service_var_suffix: GATEWAY
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  workers:
    name: Workers
    needs: [meta, core, gateway]
    if: needs.meta.outputs.branch == 'trunk' && needs.meta.outputs.action == 'build' && needs.core.result == 'success' && needs.gateway.result == 'success'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-workers
      dockerfile: nube-scripts/deploy/docker/Dockerfile.workers
      branch: trunk
      image_tag: production
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      railway_service_var_suffix: WORKERS
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  dashboards:
    name: Dashboards (combined)
    needs: [meta, core, gateway]
    if: needs.meta.outputs.branch == 'trunk' && needs.meta.outputs.action == 'build' && needs.core.result == 'success' && needs.gateway.result == 'success'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-dashboards
      dockerfile: nube-scripts/deploy/docker/Dockerfile.dashboards
      branch: trunk
      image_tag: production
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      build_args: ${{ needs.meta.outputs.production_build_args }}
      railway_service_var_suffix: DASHBOARDS
      railway_environment_id: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
    secrets: inherit

  # ── Combined production image (all-in-one via supervisord) ──────────────────
  prod-all-in-one:
    name: Production (all-in-one)
    needs: [meta, workers, dashboards]
    if: needs.meta.outputs.branch == 'trunk' && needs.meta.outputs.action == 'build' && needs.workers.result == 'success' && needs.dashboards.result == 'success'
    uses: ./.github/workflows/_build-image.yml
    with:
      image_name: nube-auth-app
      dockerfile: nube-scripts/deploy/docker/Dockerfile.app
      branch: trunk
      image_tag: production
      platforms: linux/amd64,linux/arm64
      extra_tag: ${{ needs.meta.outputs.extra_tag }}
      build_args: ${{ needs.meta.outputs.production_build_args }}
    secrets: inherit

  # ═════════════════════════════════════════════════════════════════════════
  # Redeploy an image already in GHCR. Does not build.
  # ═════════════════════════════════════════════════════════════════════════
  redeploy:
    name: Redeploy
    needs: meta
    if: needs.meta.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID_STAGING: ${{ vars.RAILWAY_SERVICE_ID_STAGING }}
          RAILWAY_SERVICE_ID_PRODUCTION_CORE: ${{ vars.RAILWAY_SERVICE_ID_PRODUCTION_CORE }}
          RAILWAY_SERVICE_ID_PRODUCTION_GATEWAY: ${{ vars.RAILWAY_SERVICE_ID_PRODUCTION_GATEWAY }}
          RAILWAY_SERVICE_ID_PRODUCTION_WORKERS: ${{ vars.RAILWAY_SERVICE_ID_PRODUCTION_WORKERS }}
          RAILWAY_SERVICE_ID_PRODUCTION_DASHBOARDS: ${{ vars.RAILWAY_SERVICE_ID_PRODUCTION_DASHBOARDS }}
          RAILWAY_SERVICE_ID_PRODUCTION_APP: ${{ vars.RAILWAY_SERVICE_ID_PRODUCTION_APP }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.branch }}" = "staging" ]; then
            ENV_NAME="staging"
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then TAG="staging"; fi
            npx tsx nube-scripts/dev/scripts/railway-deploy.ts \
              --env "$ENV_NAME" \
              --service app \
              --tag "$TAG" \
              --wait
            exit 0
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="production"; fi
          SERVICE="${{ inputs.service }}"
          if [ -n "$SERVICE" ]; then
            npx tsx nube-scripts/dev/scripts/railway-deploy.ts \
              --env production \
              --service "$SERVICE" \
              --tag "$TAG" \
              --wait
            exit 0
          fi
          for svc in core gateway workers dashboards; do
            echo "--- Deploying $svc ---"
            npx tsx nube-scripts/dev/scripts/railway-deploy.ts \
              --env production \
              --service "$svc" \
              --tag "$TAG" \
              --wait
          done
