name: Build image

# ═══════════════════════════════════════════════════════════════════════════════
# Reusable workflow: builds a single Docker image and pushes it to GHCR.
#
# Called by deploy workflows for each service. Avoids ~200 lines of duplicated
# checkout / buildx / login / metadata / build-push steps across jobs.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: 'Image name after ghcr.io/nube-auth/ (e.g. nube-auth-core)'
      dockerfile:
        required: true
        type: string
        description: 'Path to Dockerfile relative to repo root'
      branch:
        required: true
        type: string
        description: 'Git branch to check out (staging or trunk). Not used as an image tag.'
      image_tag:
        required: true
        type: string
        description: 'Environment tag Railway watches (staging or production)'
      platforms:
        required: false
        type: string
        default: 'linux/amd64'
        description: 'Build platforms (staging defaults to amd64 only)'
      build_args:
        required: false
        type: string
        default: ''
        description: 'Additional docker build args (e.g. VITE_GATEWAY_URL=...)'
      extra_tag:
        required: false
        type: string
        default: ''
        description: 'Additional tag (e.g. v1.2.3 from a semver tag push)'
    secrets:
      GH_PAT:
        required: true
        description: 'PAT with read access to nube-scripts private submodule'

env:
  REGISTRY: ghcr.io/nube-auth

jobs:
  build:
    name: ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    # Aggressive timeout: step-level timeouts sometimes fail with docker buildx,
    # so we rely on job-level timeout as the hard limit. Reduced to 30 mins
    # because builds should complete in 10-15 mins; anything longer is stuck.
    timeout-minutes: 30
    # Note: permissions are controlled by the *caller* workflow.
    # docker-build.yml must declare `packages: write`.
    steps:
      # ── Checkout with private submodule ─────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the branch this image is built for (trunk/staging), not the
          # triggering ref. A version-tag push otherwise checks out whatever
          # commit the tag points at, which can be stale, and that stale
          # source then overwrites the floating :staging/:production tags that
          # Railway watches.
          ref: ${{ inputs.branch }}
          submodules: true
          token: ${{ secrets.GH_PAT }}

      # ── Docker Buildx ───────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GHCR login ──────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image tags ──────────────────────────────────────────────────────
      # Image name specifies env and service (e.g. nube-auth-staging-all, nube-auth-prod-core).
      # Primary tag is :latest (or specified release tag).
      # Also tags with :sha-<commit_sha> for immutable traceability.
      - name: Build tag list
        id: tags
        run: |
          TAGS="type=raw,value=${{ inputs.image_tag }}"
          TAGS="${TAGS}\ntype=sha,prefix=sha-"
          if [ -n "${{ inputs.extra_tag }}" ] && [ "${{ inputs.extra_tag }}" != "${{ inputs.image_tag }}" ]; then
            TAGS="${TAGS}\ntype=raw,value=${{ inputs.extra_tag }}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}

      # ── Build & push ────────────────────────────────────────────────────
      # Step timeout often fails with buildx hangs, so job timeout is the real limit.
      # Keep this as a secondary protection. Provenance/SBOM disabled to reduce build time.
      - name: Build and push
        uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ inputs.branch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ inputs.branch }}
          # Disable to prevent hangs and reduce build time
          provenance: false
          sbom: false
          # Network mode host can help with flaky connections
          network: host
