<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0D0D10"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1F"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="g1"/>
      <feGaussianBlur stdDeviation="3" result="g2"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FAFAFA" opacity="0.06"/>
    </pattern>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#dotGrid)" clip-path="url(#roundClip)"/>
  <ellipse cx="256" cy="256" rx="240" ry="220" fill="url(#heroGlow)"/>
  <circle cx="256" cy="260" r="212" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6 10"/>
  <circle cx="256" cy="260" r="179" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 14"/>
  <ellipse cx="256" cy="310" rx="166" ry="55" fill="#6366F1" fill-opacity="0.07" filter="url(#blueGlow)"/>
  <path
    d="M256 89 L366 134 C380 138 389 151 389 166 L389 264 C389 331 330 389 265 418 L256 423 L247 418 C182 389 123 331 123 264 L123 166 C123 138 132 138 146 134 Z"
    fill="url(#shieldFill)" stroke="url(#shieldEdge)" stroke-width="3.5"
    stroke-linejoin="round" filter="url(#blueGlow)"
  />
  <path
    d="M256 108 L355 148 C366 153 375 163 375 175 L375 264 C375 324 319 377 260 404 L256 407 L252 404 C193 377 138 324 138 264 L138 175 C138 163 146 152 157 148 Z"
    fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.2" stroke-linejoin="round"
  />
  <path
    d="M195 262 L236 307 L320 209"
    fill="none" stroke="#6366F1" stroke-width="36"
    stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.08"
  />
  <path
    d="M195 262 L236 307 L320 209"
    fill="none" stroke="url(#checkGrad)" stroke-width="17"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#blueGlow)"
  />
  <g opacity="0.4">
    <line x1="228" y1="347" x2="284" y2="347" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="239" y1="360" x2="273" y2="360" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
    <line x1="249" y1="373" x2="263" y2="373" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
