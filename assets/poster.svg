<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- ── Gradients ── -->
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0D0D10"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="50%" cy="44%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftGlow" cx="0%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shieldFill" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1F"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>

    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="80%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="taglineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0"/>
      <stop offset="15%" stop-color="#71717A" stop-opacity="1"/>
      <stop offset="85%" stop-color="#71717A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#71717A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <!-- ── Filters ── -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="g1"/>
      <feGaussianBlur stdDeviation="6" result="g2"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FAFAFA" opacity="0.06"/>
    </pattern>

    <!-- Finer dot grid for right panel -->
    <pattern id="dotGridFine" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#3B82F6" opacity="0.12"/>
    </pattern>

    <!-- Clip for poster bounds -->
    <clipPath id="posterClip">
      <rect width="1400" height="900" rx="0"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BACKGROUND                                          -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect width="1400" height="900" fill="url(#posterBg)"/>

  <!-- Ambient glow layers -->
  <ellipse cx="700" cy="400" rx="620" ry="420" fill="url(#heroGlow)"/>
  <ellipse cx="0" cy="540" rx="500" ry="380" fill="url(#leftGlow)"/>

  <!-- Dot-grid texture (full canvas) -->
  <rect width="1400" height="900" fill="url(#dotGrid)" clip-path="url(#posterClip)"/>

  <!-- Subtle right-side dot grid accent  -->
  <rect x="820" y="100" width="500" height="700" fill="url(#dotGridFine)" opacity="0.5" clip-path="url(#posterClip)"/>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT GEOMETRIC FRAME LINES (structural grid)       -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Vertical left rail -->
  <line x1="80" y1="80" x2="80" y2="820" stroke="#27272A" stroke-width="1"/>
  <!-- Horizontal top rail -->
  <line x1="80" y1="80" x2="1320" y2="80" stroke="#27272A" stroke-width="1"/>
  <!-- Bottom rail -->
  <line x1="80" y1="820" x2="1320" y2="820" stroke="#27272A" stroke-width="1"/>
  <!-- Right rail -->
  <line x1="1320" y1="80" x2="1320" y2="820" stroke="#27272A" stroke-width="1"/>

  <!-- Corner dots -->
  <circle cx="80" cy="80" r="3" fill="#3B82F6" opacity="0.7"/>
  <circle cx="1320" cy="80" r="3" fill="#3B82F6" opacity="0.7"/>
  <circle cx="80" cy="820" r="3" fill="#3B82F6" opacity="0.7"/>
  <circle cx="1320" cy="820" r="3" fill="#3B82F6" opacity="0.7"/>

  <!-- Center vertical divider -->
  <line x1="700" y1="80" x2="700" y2="820" stroke="#1F1F22" stroke-width="1"/>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- HERO SHIELD (CENTER)                               -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Outer halo ring (very faint) -->
  <circle cx="700" cy="390" r="230" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6 10"/>
  <circle cx="700" cy="390" r="195" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 14"/>

  <!-- Shield shadow/bloom behind -->
  <ellipse cx="700" cy="440" rx="180" ry="60" fill="#3B82F6" fill-opacity="0.07" filter="url(#blueGlow)"/>

  <!-- Main shield shape -->
  <path
    d="
      M700 200
      L820 248
      C835 253 845 267 845 283
      L845 390
      C845 462 780 526 710 557
      L700 562
      L690 557
      C620 526 555 462 555 390
      L555 283
      C555 267 565 253 580 248
      Z
    "
    fill="url(#shieldFill)"
    stroke="url(#shieldEdge)"
    stroke-width="3.5"
    stroke-linejoin="round"
    filter="url(#blueGlow)"
  />

  <!-- Shield inner bevel rim -->
  <path
    d="
      M700 220
      L808 264
      C820 268 828 280 828 293
      L828 390
      C828 455 769 513 704 542
      L700 544
      L696 542
      C631 513 572 455 572 390
      L572 293
      C572 280 580 268 592 264
      Z
    "
    fill="none"
    stroke="#3B82F6"
    stroke-width="1"
    stroke-opacity="0.2"
    stroke-linejoin="round"
  />

  <!-- Checkmark (the proof symbol) -->
  <!-- Echo bloom layer -->
  <path
    d="M634 388 L678 436 L770 330"
    fill="none"
    stroke="#3B82F6"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.08"
  />
  <!-- Main checkmark -->
  <path
    d="M634 388 L678 436 L770 330"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#blueGlow)"
  />

  <!-- Scan lines below checkmark (fingerprint encoding motif) -->
  <g opacity="0.4">
    <line x1="670" y1="480" x2="730" y2="480" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="682" y1="494" x2="718" y2="494" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <line x1="692" y1="508" x2="708" y2="508" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  </g>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- WORDMARK: PROOFA                                   -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Main logotype -->
  <text
    x="700"
    y="640"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
    font-size="96"
    font-weight="700"
    letter-spacing="-3"
    fill="#FAFAFA"
  >PROOFA</text>

  <!-- Blue accent underline -->
  <rect x="490" y="652" width="420" height="3" rx="2" fill="url(#accentLine)"/>

  <!-- Tagline -->
  <text
    x="700"
    y="706"
    text-anchor="middle"
    font-family="'SF Pro Text', 'Helvetica Neue', 'Arial', sans-serif"
    font-size="18"
    font-weight="400"
    letter-spacing="6"
    fill="#71717A"
  >IDENTITY · SESSIONS · LICENSING</text>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- FEATURE PILLS (bottom row)                         -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g transform="translate(700, 768)">
    <!-- OAuth -->
    <g transform="translate(-295, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#A1A1AA">OAUTH 2.0</text>
    </g>
    <!-- Magic Link -->
    <g transform="translate(-148, 0)">
      <rect x="-63" y="-14" width="126" height="28" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#A1A1AA">MAGIC LINK</text>
    </g>
    <!-- Sessions -->
    <g transform="translate(0, 0)">
      <rect x="-58" y="-14" width="116" height="28" rx="14" fill="#1E3A5F" stroke="#2563EB" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#93C5FD">SESSIONS</text>
    </g>
    <!-- Licensing -->
    <g transform="translate(148, 0)">
      <rect x="-58" y="-14" width="116" height="28" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#A1A1AA">LICENSING</text>
    </g>
    <!-- Multi-tenant -->
    <g transform="translate(295, 0)">
      <rect x="-66" y="-14" width="132" height="28" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#A1A1AA">MULTI-TENANT</text>
    </g>
  </g>





  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT PANEL: OAUTH PROVIDERS + SESSION MANAGEMENT   -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- OAuth Providers card — mirrors SDK card height (170px) -->
  <g transform="translate(148, 300)">
    <rect x="0" y="0" width="220" height="170" rx="12" fill="#111113" stroke="#1F1F22" stroke-width="1"/>
    <text x="16" y="26" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="10" letter-spacing="2" fill="#52525B" font-weight="600">OAUTH PROVIDERS</text>
    <rect x="12" y="36" width="196" height="110" rx="8" fill="#0D0D10" stroke="#1F1F22" stroke-width="1"/>
    <!-- Google -->
    <circle cx="28" cy="57" r="4" fill="#4285F4"/>
    <text x="40" y="61" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#E6EDF3">Google</text>
    <rect x="152" y="49" width="44" height="16" rx="8" fill="#14532D" stroke="#16A34A" stroke-width="1"/>
    <text x="174" y="61" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="9" fill="#4ADE80">active</text>
    <!-- GitHub -->
    <circle cx="28" cy="81" r="4" fill="#6E7781"/>
    <text x="40" y="85" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#E6EDF3">GitHub</text>
    <rect x="152" y="73" width="44" height="16" rx="8" fill="#14532D" stroke="#16A34A" stroke-width="1"/>
    <text x="174" y="85" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="9" fill="#4ADE80">active</text>
    <!-- Custom -->
    <circle cx="28" cy="105" r="4" fill="#3B82F6" fill-opacity="0.5"/>
    <text x="40" y="109" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#71717A">Custom</text>
    <rect x="144" y="97" width="52" height="16" rx="8" fill="#1C1C1F" stroke="#3B82F6" stroke-width="1"/>
    <text x="170" y="109" text-anchor="middle" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="9" fill="#60A5FA">config</text>
    <!-- Divider + footer -->
    <line x1="24" y1="124" x2="196" y2="124" stroke="#1F1F22" stroke-width="1"/>
    <text x="24" y="137" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="10" fill="#52525B">+ Magic Link passwordless</text>
  </g>

  <!-- Session Management card — mirrors Rate Limiting card height (104px) -->
  <g transform="translate(148, 494)">
    <rect x="0" y="0" width="220" height="104" rx="12" fill="#111113" stroke="#1F1F22" stroke-width="1"/>
    <text x="16" y="26" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="10" letter-spacing="2" fill="#52525B" font-weight="600">SESSION MANAGEMENT</text>
    <!-- User sessions row -->
    <text x="16" y="48" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#71717A">Users</text>
    <text x="204" y="48" text-anchor="end" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#FAFAFA">365 days</text>
    <!-- Admin sessions row -->
    <text x="16" y="66" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#71717A">Admins</text>
    <text x="204" y="66" text-anchor="end" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#FAFAFA">2h + 15m inactivity</text>
    <line x1="16" y1="83" x2="204" y2="83" stroke="#27272A" stroke-width="1"/>
    <circle cx="28" cy="96" r="4" fill="#3B82F6"/>
    <text x="40" y="101" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#52525B">Redis-backed sessions</text>
  </g>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL: STACK + SDK                           -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- TypeScript SDK card -->
  <g transform="translate(1032, 300)">
    <rect x="0" y="0" width="220" height="170" rx="12" fill="#111113" stroke="#1F1F22" stroke-width="1"/>
    <text x="16" y="26" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="10" letter-spacing="2" fill="#52525B" font-weight="600">TYPESCRIPT SDK</text>
    <!-- Code snippet -->
    <rect x="12" y="36" width="196" height="110" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="24" y="57" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#8B949E">import</text>
    <text x="64" y="57" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#E6EDF3">{ Proofa }</text>
    <text x="120" y="57" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#8B949E">from</text>
    <text x="24" y="73" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#A5D6FF">'@proofa/client'</text>
    <line x1="24" y1="82" x2="196" y2="82" stroke="#21262D" stroke-width="1"/>
    <text x="24" y="97" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#7EE787">const</text>
    <text x="60" y="97" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#E6EDF3">auth =</text>
    <text x="24" y="113" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#E6EDF3">  </text>
    <text x="30" y="113" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#79C0FF">new</text>
    <text x="52" y="113" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#E6EDF3">Proofa(config)</text>
    <text x="24" y="129" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#FFA657">auth</text>
    <text x="56" y="129" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#8B949E">.verify(token)</text>
  </g>

  <!-- Rate limiting card -->
  <g transform="translate(1032, 494)">
    <rect x="0" y="0" width="220" height="104" rx="12" fill="#111113" stroke="#1F1F22" stroke-width="1"/>
    <text x="16" y="26" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="10" letter-spacing="2" fill="#52525B" font-weight="600">RATE LIMITING</text>
    <!-- Progress bar -->
    <rect x="16" y="40" width="188" height="8" rx="4" fill="#1C1C1F"/>
    <rect x="16" y="40" width="120" height="8" rx="4" fill="#3B82F6" opacity="0.8"/>
    <text x="16" y="70" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#52525B">Redis sliding window</text>
    <line x1="16" y1="83" x2="204" y2="83" stroke="#27272A" stroke-width="1"/>
    <circle cx="28" cy="96" r="4" fill="#3B82F6"/>
    <text x="40" y="101" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="11" fill="#52525B">Per-endpoint configurable</text>
  </g>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TOP BADGE (version / open-source)                  -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g transform="translate(700, 120)">
    <rect x="-56" y="-13" width="112" height="26" rx="13" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <circle cx="-36" cy="0" r="4" fill="#16A34A"/>
    <text x="-24" y="5" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="12" font-weight="500" letter-spacing="0.5" fill="#71717A">v0.1.0 · MIT</text>
  </g>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BOTTOM HORIZONTAL ACCENT LINE                      -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="200" y1="810" x2="1200" y2="810" stroke="url(#dividerGrad)" stroke-width="1"/>
</svg>
