<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinboardGPT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Loading State -->
    <div id="loading-state" class="state">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Not Logged In State -->
    <div id="logged-out-state" class="state hidden">
      <div class="logo">
        <img src="../icons/icon48.png" alt="PinboardGPT">
      </div>
      <h1>PinboardGPT</h1>
      <p class="subtitle">AI-powered bookmarks for developers</p>
      <button id="login-btn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 0L10.5 5L16 5.75L12 9.5L13 15L8 12.25L3 15L4 9.5L0 5.75L5.5 5L8 0Z" fill="currentColor"/>
        </svg>
        Sign In
      </button>
      <p class="hint">Sign in to sync your bookmarks</p>
    </div>

    <!-- Logged In State -->
    <div id="logged-in-state" class="state hidden">
      <!-- User Header -->
      <div class="user-header">
        <img id="user-avatar" src="" alt="Avatar" class="avatar">
        <div class="user-info">
          <h2 id="user-name"></h2>
          <p id="user-email" class="email"></p>
        </div>
      </div>

      <!-- License Info -->
      <div class="license-info">
        <div class="license-header">
          <span class="label">Current Plan</span>
          <span id="license-plan" class="plan"></span>
        </div>
        <div class="license-status">
          <span id="license-status-badge" class="badge"></span>
          <p id="license-expires" class="expires"></p>
        </div>
      </div>

      <!-- Quick Stats (Optional) -->
      <div class="stats">
        <div class="stat-item">
          <span class="stat-value" id="bookmark-count">-</span>
          <span class="stat-label">Bookmarks</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="collection-count">-</span>
          <span class="stat-label">Collections</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="upgrade-btn" class="btn btn-upgrade hidden">
          ⭐ Upgrade to Pro
        </button>
        <button id="manage-btn" class="btn btn-secondary">
          Manage Account
        </button>
      </div>

      <!-- Footer Actions -->
      <div class="footer-actions">
        <button id="refresh-btn" class="btn-icon" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M13.5 2.5C12.2 1.2 10.4 0.5 8.5 0.5C4.4 0.5 1 3.9 1 8C1 12.1 4.4 15.5 8.5 15.5C11.9 15.5 14.8 13.1 15.4 9.9H13.5C13 12.1 11 13.7 8.5 13.7C5.4 13.7 2.8 11.1 2.8 8C2.8 4.9 5.4 2.3 8.5 2.3C10 2.3 11.3 2.9 12.3 3.9L9.5 6.7H15.5V0.7L13.5 2.5Z" fill="currentColor"/>
          </svg>
        </button>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 14H3C2.4 14 2 13.6 2 13V3C2 2.4 2.4 2 3 2H6M11 11L14 8M14 8L11 5M14 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-state" class="state hidden">
      <div class="error-icon">⚠️</div>
      <h2>Connection Error</h2>
      <p class="error-message">Failed to load your data</p>
      <button id="retry-btn" class="btn btn-primary">Retry</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
