; ─────────────────────────────────────────────────────────────────────────────
; Nube Auth – supervisord config for Dockerfile.app (all-in-one staging container)
;
; Manages four processes:
;   nginx   — serves dashboards + reverse-proxies API/core/workers subdomains
;   core    — Nube Auth core service  (port 3003)
;   gateway — Nube Auth gateway       (port 3004, nginx proxies public traffic here)
;   workers — Nube Auth workers       (port 3005, internal health-check only)
;
; All programs inherit the full container environment (Railway injected vars +
; Dockerfile ENV defaults).  Only port overrides are applied inline via shell.
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

; ── nginx ─────────────────────────────────────────────────────────────────────
; nginx config is generated by /docker-entrypoint.sh BEFORE supervisord starts,
; so nginx can start cleanly without a pre-flight script here.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ── core (port 3003) ──────────────────────────────────────────────────────────
; CORE_PORT=3003 is set in Dockerfile ENV and inherited here.
[program:core]
command=node /app/core/dist/index.js
directory=/app/core
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ── gateway (port 3004) ───────────────────────────────────────────────────────
; GATEWAY_PORT=3004 is set in Dockerfile ENV and inherited here.
[program:gateway]
command=node /app/gateway/dist/index.js
directory=/app/gateway
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; ── workers (port 3005) ───────────────────────────────────────────────────────
; Workers reads PORT for its health-check HTTP server.  Railway injects PORT=8080
; (which nginx already owns), so we override it to 3005 via the shell command.
; The shell inherits the full parent environment then adds PORT=3005 before exec.
[program:workers]
command=/bin/sh -c "PORT=3005 exec node /app/workers/dist/index.js"
directory=/app/workers
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
