server {
    listen 8080;

    # ── Admin SPA (/admin/) ───────────────────────────────────────────────────
    # Built with Vite base=/admin/ — assets are at /admin/assets/...
    # SPA fallback: unknown paths → /admin/index.html for React Router
    location /admin/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── User SPA (/user/) ─────────────────────────────────────────────────────
    location /user/ {
        alias /var/www/user/;
        try_files $uri $uri/ /user/index.html;
    }

    # ── Docs (/docs/) ─────────────────────────────────────────────────────────
    # VitePress generates full static HTML per route, fallback to docs index
    location /docs/ {
        alias /var/www/docs/;
        try_files $uri $uri/ $uri.html $uri/index.html /docs/index.html;
    }

    # ── Home (root /) ─────────────────────────────────────────────────────────
    # Astro static site — must come last so the more specific prefixes above win
    location / {
        root /var/www/home;
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Long-lived cache for hashed assets in all dashboards
    location ~* ^/(admin|user|docs)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
