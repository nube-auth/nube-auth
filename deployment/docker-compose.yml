services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: nube-auth-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nube-auth}
      POSTGRES_USER: ${POSTGRES_USER:-nube-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env or .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nube-auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching, rate limiting, and session storage
  redis:
    image: redis:7-alpine
    container_name: nube-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mailpit - Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: nube-auth-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: nube-auth-network
