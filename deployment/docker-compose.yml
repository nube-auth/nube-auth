services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: nube-auth-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nube-auth}
      POSTGRES_USER: ${POSTGRES_USER:-nube-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nube-auth-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nube-auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching, rate limiting, and session storage
  redis:
    image: redis:7-alpine
    container_name: nube-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mailpit - Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: nube-auth-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  # ── Individual Services (production topology) ───────────────────────────────
  # Each service fetches its env from the DaemonHound vault at startup.
  # Required env vars (set in .env or shell):
  #   DHD_VAULT_REMOTE  - e.g. git@github.com:you/nube-auth-vault.git
  #   DHD_AGE_KEY       - Age secret key (export from dhd export-identity)

  core:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.core
    container_name: nube-auth-core
    ports:
      - "3003:8080"
    environment:
      - DHD_VAULT_REMOTE=${DHD_VAULT_REMOTE:-}
      - DHD_AGE_KEY=${DHD_AGE_KEY:-}
      - DHD_NAMESPACE=${DHD_NAMESPACE:-github.com/nube-auth/nube-auth}
      - DHD_FILE=${DHD_FILE:-.env.prod}
      - DHD_SKIP=${DHD_SKIP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
    container_name: nube-auth-gateway
    ports:
      - "3004:8080"
    environment:
      - DHD_VAULT_REMOTE=${DHD_VAULT_REMOTE:-}
      - DHD_AGE_KEY=${DHD_AGE_KEY:-}
      - DHD_NAMESPACE=${DHD_NAMESPACE:-github.com/nube-auth/nube-auth}
      - DHD_FILE=${DHD_FILE:-.env.prod}
      - DHD_SKIP=${DHD_SKIP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_started
    restart: unless-stopped

  workers:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.workers
    container_name: nube-auth-workers
    ports:
      - "3005:8080"
    environment:
      - DHD_VAULT_REMOTE=${DHD_VAULT_REMOTE:-}
      - DHD_AGE_KEY=${DHD_AGE_KEY:-}
      - DHD_NAMESPACE=${DHD_NAMESPACE:-github.com/nube-auth/nube-auth}
      - DHD_FILE=${DHD_FILE:-.env.prod}
      - DHD_SKIP=${DHD_SKIP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_started
    restart: unless-stopped

  # ── Combined All-in-One (staging / single-node) ─────────────────────────────
  # Runs core + gateway + workers + nginx dashboards in one container.
  # Same dhd vault fetch as individual services.

  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.app
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:3004}
        VITE_HOME_URL: ${VITE_HOME_URL:-http://localhost:4321}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-http://localhost:4322}
        VITE_ENV_TAG: ${VITE_ENV_TAG:-Local}
        VITE_COOKIE_NAMESPACE: ${VITE_COOKIE_NAMESPACE:-}
    container_name: nube-auth-app
    ports:
      - "8080:8080"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SUBDOMAIN_PREFIX=${SUBDOMAIN_PREFIX:-}
      - DHD_VAULT_REMOTE=${DHD_VAULT_REMOTE:-}
      - DHD_AGE_KEY=${DHD_AGE_KEY:-}
      - DHD_NAMESPACE=${DHD_NAMESPACE:-github.com/nube-auth/nube-auth}
      - DHD_FILE=${DHD_FILE:-.env.prod}
      - DHD_SKIP=${DHD_SKIP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: nube-auth-network
