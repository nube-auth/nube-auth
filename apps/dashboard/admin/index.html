<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers (Fallback - prefer HTTP headers in production) -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval'; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   img-src 'self' data: https:; 
                   connect-src 'self' http://localhost:* https:; 
                   font-src 'self' https://fonts.gstatic.com; 
                   object-src 'none'; 
                   base-uri 'self'; 
                   form-action 'self';">
    <!-- X-Frame-Options must be set via HTTP headers, not meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA / Theme -->
    <meta name="theme-color" content="#09090B" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Nube Auth - Admin Dashboard</title>
        <!-- Critical CSS to prevent flash of white background -->
    <style>
      html, body {
        background: #09090B; /* Dark theme default */
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]), html:not([data-theme="dark"]) body {
          background: #FAFAFA;
        }
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background: #FAFAFA;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #09090B;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
