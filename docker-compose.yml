services:
  # Redis for caching, rate limiting, and session storage
  redis:
    image: redis:7-alpine
    container_name: proofa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis REST API Proxy (Upstash-compatible HTTP interface for local dev)
  redis-rest:
    image: hiett/serverless-redis-http:latest
    container_name: proofa-redis-rest
    ports:
      - "8079:80"
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=local-dev-token
      - SRH_CONNECTION_STRING=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis Commander - Web UI for Redis (optional, for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: proofa-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - debug

  # LibSQL Server (Turso-compatible SQLite)
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: proofa-libsql
    ports:
      - "8080:8080"   # HTTP API
      - "5001:5001"   # gRPC
    volumes:
      - libsql_data:/var/lib/sqld
    environment:
      - SQLD_NODE=primary
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mailpit - Local email testing (catches all outgoing emails)
  mailpit:
    image: axllent/mailpit:latest
    container_name: proofa-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    restart: unless-stopped
    profiles:
      - email

volumes:
  redis_data:
    driver: local
  libsql_data:
    driver: local

networks:
  default:
    name: proofa-network
