services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: proofa-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofa}
      POSTGRES_USER: ${POSTGRES_USER:-proofa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env or .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofa"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching, rate limiting, and session storage
  redis:
    image: redis:7-alpine
    container_name: proofa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Commander - Web UI for Redis (optional, for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: proofa-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - debug

  # Mailpit - Local email testing (catches all outgoing emails)
  mailpit:
    image: axllent/mailpit:latest
    container_name: proofa-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    restart: unless-stopped
    profiles:
      - email

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: proofa-network
